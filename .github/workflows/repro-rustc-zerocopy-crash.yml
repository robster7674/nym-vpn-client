name: repro-rustc-zerocopy-crash

# Throwaway: reproduce the rustc SIGABRT ("corrupted double-linked list") seen while
# compiling zerocopy 0.8.63 in run 43842725611 attempt 1 (riscv-runner-36), and keep
# a core dump of it. Repeats clippy then the full build, as in the job where it first hit, two builds at a time.
# (A replay of the exact rustc call on zerocopy ran ~80 times without a crash, so it was dropped.)
# Every compiler process runs with a scrubbed environment, so cores carry no CI tokens.

on:
  push:
    branches: [repro/rustc-zerocopy-crash]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: never
  AGENT_ISSELFHOSTED: 1

jobs:
  repro:
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 600
    steps:
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libmnl-dev libnftnl-dev protobuf-compiler git curl gcc g++ make pkg-config unzip jq libnm-dev libgtk-3-dev libgtk-4-dev gdb zstd

      - name: Checkout repo
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Dotenv Action
        uses: xom9ikk/dotenv@v2.4.0

      - name: Install Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GOLANG_VERSION }}
          cache-dependency-path: wireguard/libwg/go.sum

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy

      - name: Machine info
        run: |
          hostname; uname -a; nproc; free -m; df -h "$RUNNER_TEMP"
          rustc -vV
          ldd --version | head -1
          cat /proc/sys/kernel/core_pattern
          echo "RUSTC_BIN=$(rustup which rustc)" >> "$GITHUB_ENV"

      - name: Set up core dumps
        run: |
          CORES="$RUNNER_TEMP/cores"; mkdir -p "$CORES"; chmod 1777 "$CORES"
          echo "CORES=$CORES" >> "$GITHUB_ENV"
          sudo sysctl -w kernel.core_pattern="$CORES/core.%e.%p.%t" || true
          echo "core_pattern: $(cat /proc/sys/kernel/core_pattern)"
          # Self-test: an aborted process must leave a core, or the run fails early
          (ulimit -c unlimited; sleep 60 & p=$!; sleep 1; kill -ABRT $p; wait $p) || true
          sleep 2
          if ls "$CORES"/core.sleep.* >/dev/null 2>&1; then
            echo "Kernel core dumps work"
          else
            echo "::error::No kernel core dump, a crash would leave nothing to collect"; exit 1
          fi
          rm -f "$CORES"/core.sleep.*

      - name: Fetch sources and build wireguard
        run: |
          (cd nym-vpn-core && cargo fetch --locked)
          ./wireguard/build-wireguard-go.sh

      - name: "Repeat the full workspace build, two at a time"
        working-directory: nym-vpn-core
        env:
          PARALLEL: 2
        run: |
          set -u
          ulimit -c unlimited
          # One build loop per target dir, run side by side to load the 4-core, 16 GiB runner.
          # A core file means a crash: every loop stops. A failure without a core (e.g. OOM kill)
          # is logged and the loop goes on, unless it keeps happening.
          cat > "$RUNNER_TEMP/build-loop.sh" <<'EOF'
          set -u
          n=$1; td="$RUNNER_TEMP/target-$n"; i=0; fails=0
          while [ ! -e "$RUNNER_TEMP/stop" ]; do
            i=$((i+1)); rc=0; echo "## Full build $n.$i ($(date -u +%H:%M:%S))"
            env -i PATH="$HOME/.cargo/bin:/usr/bin:/bin" HOME="$HOME" CARGO_HOME="$CARGO_HOME" \
              RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}" RUSTUP_TOOLCHAIN="$RUST_VERSION" CARGO_TERM_COLOR=never \
              CARGO_TARGET_DIR="$td" \
              bash -c 'cargo clippy --workspace --locked -- -Dwarnings && cargo build --profile ci --workspace --locked' \
              > "$RUNNER_TEMP/build-$n.log" 2>&1 || rc=$?
            if ls "$CORES"/core.* >/dev/null 2>&1; then
              echo "::error::core file found after build $n.$i (rc $rc)"; tail -c 6000 "$RUNNER_TEMP/build-$n.log"
              cp "$RUNNER_TEMP/build-$n.log" "$CORES/build-$n.$i.log"; touch "$RUNNER_TEMP/stop"; exit 1
            fi
            if [ $rc -ne 0 ]; then
              fails=$((fails+1)); echo "::warning::build $n.$i failed without a core (rc $rc)"
              tail -c 3000 "$RUNNER_TEMP/build-$n.log"; cp "$RUNNER_TEMP/build-$n.log" "$CORES/build-$n.$i.log"
              if [ $fails -ge 3 ]; then echo "::error::loop $n failed 3 times"; touch "$RUNNER_TEMP/stop"; exit 2; fi
            else
              fails=0
            fi
            rm -rf "$td"; df -h "$RUNNER_TEMP" | tail -1
          done
          EOF
          pids=()
          for n in $(seq 1 "$PARALLEL"); do
            bash "$RUNNER_TEMP/build-loop.sh" "$n" & pids+=($!); sleep 120
          done
          rc=0
          for p in "${pids[@]}"; do wait "$p" || rc=1; done
          exit $rc

      - name: Collect core dump and binaries
        if: failure()
        run: |
          shopt -s nullglob
          cores=("$CORES"/core.*)
          mkdir -p dump
          cp "$CORES"/*.log dump/ 2>/dev/null || true
          [ ${#cores[@]} -gt 0 ] || { echo "No core files"; exit 0; }
          ls -la "$CORES"
          TC=$(dirname "$(dirname "$RUSTC_BIN")")
          mkdir -p dump/bin
          cp "$TC/bin/rustc" "$TC"/lib/librustc_driver-*.so "$TC"/lib/libLLVM*.so* dump/bin/ 2>/dev/null || true
          cp "$TC"/lib/libstd-*.so dump/bin/ 2>/dev/null || true
          for c in "${cores[@]}"; do
            exe=$(file "$c" | sed -n "s/.*execfn: '\([^']*\)'.*/\1/p")
            echo "== $c ($exe)"
            gdb -q -batch -nx -ex 'set pagination off' -ex 'info sharedlibrary' -ex 'thread apply all bt' \
              "${exe:-$RUSTC_BIN}" "$c" > "$c.bt.txt" 2>&1 || true
            head -c 4000 "$c.bt.txt"
            zstd -q -T0 -19 "$c" -o "dump/$(basename "$c").zst"; cp "$c.bt.txt" dump/
          done
          cp "$CORES"/*.log dump/ 2>/dev/null || true
          (cd dump/bin && for f in *; do echo "$f $(readelf -n "$f" | awk '/Build ID/{print $3}')"; done) > dump/build-ids.txt
          { hostname; uname -a; rustc -vV; ldd --version | head -1; } > dump/machine.txt
          du -sh dump/* dump/bin/*

      - name: Upload core dump
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: rustc-crash-dump
          path: dump/
          if-no-files-found: ignore
          retention-days: 7

      - name: Kernel log
        if: always()
        run: sudo dmesg | tail -50 || true
