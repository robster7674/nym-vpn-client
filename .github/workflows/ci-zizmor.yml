name: ci-zizmor
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zizmor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fails on high-severity findings only; medium ones (artipacked,
      # secrets-inherit, ...) are not yet worked through
      - name: Audit workflows and actions
        env:
          IMAGE: ghcr.io/zizmorcore/zizmor@sha256:42d409dbb851d4c5d35a058cf042b828bea1e3f2884378c526eb0974780e18d9 # 1.31.1
          GH_TOKEN: ${{ github.token }}
        run: |
          docker run --rm -e GH_TOKEN -v "$PWD:/repo:ro" -w /repo "$IMAGE" \
            --format github --min-severity high .
