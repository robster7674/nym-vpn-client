name: ci-nym-vpn-core-linux-riscv64

# Native riscv64 build on the RISE RISC-V runners (https://ci.riseproject.dev/).
# Needs the RISE GitHub App installed on the repo, otherwise the job stays queued,
# so PR runs are gated on the RISCV_RUNNERS repo variable being "true".

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "nym-vpn-core/crates/**"
      - "nym-vpn-core/Cargo.toml"
      - "nym-vpn-core/Cargo.lock"
      - "wireguard/**"
      - ".env"
      - ".github/workflows/ci-nym-vpn-core-linux-riscv64.yml"
  workflow_dispatch:

env:
  CI_TESTING: true
  CARGO_TERM_COLOR: always
  AGENT_ISSELFHOSTED: 1 # https://github.com/actions/setup-go/issues/432

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: vars.RISCV_RUNNERS == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-riscv
    # The runners are slow (4-core TH1520) and run one job per node
    timeout-minutes: 600

    steps:
      - name: Install system dependencies
        # protoc comes from apt: 3.21.12 on ubuntu 24.04, and there is no upstream riscv64 release
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libmnl-dev libnftnl-dev protobuf-compiler git curl gcc g++ make pkg-config unzip jq libnm-dev libgtk-3-dev libgtk-4-dev

      - name: Checkout repo
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Dotenv Action
        uses: xom9ikk/dotenv@v2.4.0

      - name: Install Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GOLANG_VERSION }}
          cache-dependency-path: wireguard/libwg/go.sum

      - name: Build wireguard
        run: ./wireguard/build-wireguard-go.sh

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy

      - name: Print toolchain info
        run: |
          uname -m
          rustc -vV
          go version
          protoc --version

      - name: Clippy
        working-directory: nym-vpn-core
        run: |
          cargo clippy --workspace --locked -- -Dwarnings

      - name: Build
        working-directory: nym-vpn-core
        run: |
          cargo build --profile ci --workspace --locked

      - name: Build tests
        working-directory: nym-vpn-core
        run: |
          CARGO_OUTPUT=$(cargo test --profile ci --no-run --workspace --locked --message-format json)

          NYM_CONNECTION_MONITOR_TESTS_BIN=$(echo "$CARGO_OUTPUT" | jq --raw-output 'select(.reason == "compiler-artifact" and .target.name == "nym_connection_monitor" and .executable != null) | .executable')

          echo "Found test binary for nym-connection-monitor: $NYM_CONNECTION_MONITOR_TESTS_BIN"
          sudo setcap 'cap_net_raw+ep' $NYM_CONNECTION_MONITOR_TESTS_BIN

      - name: Run tests
        working-directory: nym-vpn-core
        run: |
          # Skipped: they race on the transient Syncing state on slow runners (issue #17)
          cargo test --profile ci --workspace --locked --exclude nym-ifconfig -- \
            --skip commands::ready_state_command \
            --skip commands::error_state_command

      - name: Test NetworkManager editor plugin
        run: make -C nym-vpn-core/crates/nym-nm-vpn-plugin/editor test

      - name: Upload binaries
        uses: actions/upload-artifact@v7.0.1
        with:
          name: nym-vpn-core_riscv64gc-unknown-linux-gnu
          path: |
            nym-vpn-core/target/ci/nym-vpnd
            nym-vpn-core/target/ci/nym-vpnc
          if-no-files-found: error
          retention-days: 7
