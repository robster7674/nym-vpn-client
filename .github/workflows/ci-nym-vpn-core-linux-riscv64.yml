name: ci-nym-vpn-core-linux-riscv64

# Native riscv64 build on free RISC-V runners:
# - RISE (https://ci.riseproject.dev/): Scaleway EM-RV1 nodes
# - Cloud-V (https://cloud-v.co/github-riscv-runner): Milk-V Pioneer, SG2042 64 cores
# Each needs its GitHub App installed on the repo, otherwise the job stays queued,
# so PR runs are gated on the RISCV_RUNNERS repo variable being "true".

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "nym-vpn-core/crates/**"
      - "nym-vpn-core/Cargo.toml"
      - "nym-vpn-core/Cargo.lock"
      - "wireguard/**"
      - ".env"
      - ".github/workflows/ci-nym-vpn-core-linux-riscv64.yml"
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

env:
  CI_TESTING: true
  CARGO_TERM_COLOR: always
  AGENT_ISSELFHOSTED: 1 # https://github.com/actions/setup-go/issues/432
  SCCACHE_VERSION: v0.19.0
  SCCACHE_SHA256: 4283c8b336a8c14da7bf5ef46e8a596e8764f931679b6a78f76c081010ac4648

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: vars.RISCV_RUNNERS == 'true' || github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: rise-em-rv1
            runs-on: '"ubuntu-24.04-riscv"'
          - board: cloudv-pioneer
            runs-on: '["self-hosted", "milkv-pioneer"]'
    runs-on: ${{ fromJSON(matrix.runs-on) }}
    # The runners are slow and ephemeral, and run one job per node
    timeout-minutes: 600

    steps:
      - name: Install system dependencies
        # protoc comes from apt: 3.21.12 on ubuntu 24.04, and there is no upstream riscv64 release
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libmnl-dev libnftnl-dev protobuf-compiler git curl gcc g++ make pkg-config unzip jq zstd libnm-dev libgtk-3-dev libgtk-4-dev

      - name: Checkout repo
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Dotenv Action
        uses: xom9ikk/dotenv@v2.4.0

      - name: Cache libwg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: libwg-cache
        with:
          path: build/lib
          key: libwg-riscv64-go${{ env.GOLANG_VERSION }}-${{ hashFiles('wireguard/libwg/**/*.{go,diff,mod,h}', 'wireguard/build-wireguard-go.sh') }}

      - name: Install Go
        if: steps.libwg-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GOLANG_VERSION }}
          cache-dependency-path: wireguard/libwg/go.sum

      - name: Build wireguard
        if: steps.libwg-cache.outputs.cache-hit != 'true'
        run: ./wireguard/build-wireguard-go.sh

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy

      - name: Install sccache
        # mozilla-actions/sccache-action (used by setup-sccache) has no riscv64 build
        run: |
          name="sccache-${SCCACHE_VERSION}-riscv64gc-unknown-linux-musl"
          curl -fsSL -o /tmp/sccache.tar.gz "https://github.com/mozilla/sccache/releases/download/${SCCACHE_VERSION}/${name}.tar.gz"
          echo "${SCCACHE_SHA256}  /tmp/sccache.tar.gz" | sha256sum -c -
          tar -xzf /tmp/sccache.tar.gz -C /tmp
          sudo install -m 755 "/tmp/${name}/sccache" /usr/local/bin/sccache
          echo "RUSTC_WRAPPER=/usr/local/bin/sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_DIR=$HOME/.cache/sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_CACHE_SIZE=5G" >> "$GITHUB_ENV"
          echo "SCCACHE_IDLE_TIMEOUT=0" >> "$GITHUB_ENV"
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"

      - name: Restore sccache
        # Runners are ephemeral, so the local sccache dir round-trips through the Actions cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/sccache
          key: sccache-riscv64-${{ matrix.board }}-${{ env.RUST_VERSION }}-${{ hashFiles('nym-vpn-core/Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            sccache-riscv64-${{ matrix.board }}-${{ env.RUST_VERSION }}-${{ hashFiles('nym-vpn-core/Cargo.lock') }}-
            sccache-riscv64-${{ matrix.board }}-${{ env.RUST_VERSION }}-

      - name: Print toolchain info
        run: |
          uname -m
          nproc
          rustc -vV
          go version || true
          protoc --version
          sccache --version

      - name: Clippy
        working-directory: nym-vpn-core
        run: |
          cargo clippy --workspace --locked -- -Dwarnings

      - name: Build
        working-directory: nym-vpn-core
        run: |
          cargo build --profile ci --workspace --locked

      - name: Build tests
        working-directory: nym-vpn-core
        run: |
          CARGO_OUTPUT=$(cargo test --profile ci --no-run --workspace --locked --message-format json)

          NYM_CONNECTION_MONITOR_TESTS_BIN=$(echo "$CARGO_OUTPUT" | jq --raw-output 'select(.reason == "compiler-artifact" and .target.name == "nym_connection_monitor" and .executable != null) | .executable')

          echo "Found test binary for nym-connection-monitor: $NYM_CONNECTION_MONITOR_TESTS_BIN"
          sudo setcap 'cap_net_raw+ep' $NYM_CONNECTION_MONITOR_TESTS_BIN

      - name: Save sccache
        # Saved before the tests so a flaky test doesn't throw away the compile work
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/sccache
          key: sccache-riscv64-${{ matrix.board }}-${{ env.RUST_VERSION }}-${{ hashFiles('nym-vpn-core/Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: sccache stats
        if: always()
        run: sccache --show-stats

      - name: Run tests
        working-directory: nym-vpn-core
        run: |
          # Skipped: they race on the transient Syncing state on slow runners (issue #17)
          cargo test --profile ci --workspace --locked --exclude nym-ifconfig -- \
            --skip commands::ready_state_command \
            --skip commands::error_state_command

      - name: Test NetworkManager editor plugin
        run: make -C nym-vpn-core/crates/nym-nm-vpn-plugin/editor test

      - name: Upload binaries
        uses: actions/upload-artifact@v7.0.1
        with:
          name: nym-vpn-core_riscv64gc-unknown-linux-gnu_${{ matrix.board }}
          path: |
            nym-vpn-core/target/ci/nym-vpnd
            nym-vpn-core/target/ci/nym-vpnc
          if-no-files-found: error
          retention-days: 7
