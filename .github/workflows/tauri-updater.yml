name: tauri-updater
on:
  workflow_call:
    inputs:
      channel:
        type: string
        required: true
      version:
        type: string
        required: true
      # https://v2.tauri.app/plugin/updater/#static-json-file
      base_url:
        type: string
        required: true
      signature_x64:
        type: string
        required: true
      signature_arm64:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      channel:
        description: "Build channel"
        type: choice
        options:
          - stable
          - dev
        required: true
        default: "stable"
      version:
        description: "Semver app version"
        type: string
        required: true
        default: "0.0.0"
      base_url:
        description: "Base download URL (release asset directory, e.g. .../releases/download/nym-vpn-app-v0.0.0)"
        type: string
        required: true
        default: "https://github.com/nymtech/nym-vpn-client/releases/download/nym-vpn-app-v0.0.0"
      signature_x64:
        description: "Signature of the x64 update bundle (content of *setup.exe.sig)"
        type: string
        required: true
        default: ""
      signature_arm64:
        description: "Signature of the arm64 update bundle (content of *setup.exe.sig)"
        type: string
        required: true
        default: ""

permissions:
  contents: read

jobs:
  update-metadata:
    runs-on: arc-linux-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      JSON_FILE: ${{ inputs.channel == 'stable' && 'stable.json' || 'dev.json' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          ref: "develop"

      - name: Install yq
        env:
          YQ_VERSION: v4.54.1
          YQ_SHA256: 8e34fc298390875de416e6a4afcb8cabeceb25d9aa8506c1a2f9353cf702ea5f
        run: |
          wget -q "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" -O "$RUNNER_TEMP/yq"
          echo "${YQ_SHA256}  $RUNNER_TEMP/yq" | sha256sum -c -
          sudo install -m 0755 "$RUNNER_TEMP/yq" /usr/bin/yq

      - name: Update metadata (${{ inputs.channel }})
        working-directory: .pkg/tauri-updater
        env:
          VERSION: ${{ inputs.version }}
          BASE_URL: ${{ inputs.base_url }}
          SIGNATURE_X64: ${{ inputs.signature_x64 }}
          SIGNATURE_ARM64: ${{ inputs.signature_arm64 }}
        run: |
          yq -i '
            .version = strenv(VERSION) |
            .platforms."windows-x86_64".url = strenv(BASE_URL) + "/NymVPN_" + strenv(VERSION) + "_x64-setup.exe" |
            .platforms."windows-x86_64".signature = strenv(SIGNATURE_X64) |
            .platforms."windows-aarch64".url = strenv(BASE_URL) + "/NymVPN_" + strenv(VERSION) + "_arm64-setup.exe" |
            .platforms."windows-aarch64".signature = strenv(SIGNATURE_ARM64)
          ' "$JSON_FILE"
          echo "updated metadata"
          cat "$JSON_FILE"

      - name: Create PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          GIT_BRANCH: "tauri-updater-${{ inputs.channel }}-${{ inputs.version }}"
          COMMIT_MSG: "tauri-updater: update metadata ${{ inputs.channel }} v${{ inputs.version }}"
          PR_TITLE: "tauri-updater: update metadata ${{ inputs.channel }} v${{ inputs.version }}"
          PR_BODY: |
            Update tauri updater metadata
            - channel: `${{ inputs.channel }}`
            - version: `${{ inputs.version }}`
        run: |
          git config --global user.name "NYM_bot"
          git config --global user.email "_@_"
          git switch -C "$GIT_BRANCH"
          git add .pkg/tauri-updater
          git commit -m "$COMMIT_MSG"
          git push --force origin "$GIT_BRANCH"
          EXISTING_PR=$(gh pr view "$GIT_BRANCH" --json url --jq '.url' 2>/dev/null || true)
          if [ -n "$EXISTING_PR" ]; then
            echo "PR already exists: $EXISTING_PR"
          else
            gh pr create --title "$PR_TITLE" --body "$PR_BODY" --base develop --reviewer "agentpietrucha"
          fi
