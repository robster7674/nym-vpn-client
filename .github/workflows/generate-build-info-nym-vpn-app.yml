name: generate-build-info-nym-vpn-app
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      build-profile:
        description: "Rust build profile"
        required: true
        default: Release
        type: string

permissions:
  contents: read

jobs:
  generate-build-info-nym-vpn-app:
    runs-on: arc-linux-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Dotenv Action
        uses: xom9ikk/dotenv@d0a56edc74279820eabbe34477511327e710d0de # v2.4.0

      - name: Install yq
        env:
          YQ_VERSION: v4.54.1
          YQ_SHA256: 8e34fc298390875de416e6a4afcb8cabeceb25d9aa8506c1a2f9353cf702ea5f
        run: |
          wget -q "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" -O "$RUNNER_TEMP/yq"
          echo "${YQ_SHA256}  $RUNNER_TEMP/yq" | sha256sum -c -
          sudo install -m 0755 "$RUNNER_TEMP/yq" /usr/bin/yq

      - name: Get current date
        id: date
        run: echo "date=$(date)" >> $GITHUB_OUTPUT

      - name: Generate build-info
        env:
          BUILD_PROFILE: ${{ inputs.build-profile }}
          BUILD_DATE: ${{ steps.date.outputs.date }}
        run: |
          touch build-info.txt
          echo "App name:      $(yq -oy '.productName' nym-vpn-app/src-tauri/tauri.conf.json)" >> build-info.txt
          echo "Version:       $(yq -oy '.package.version' nym-vpn-app/src-tauri/Cargo.toml)" >> build-info.txt
          echo "Tauri version: $(yq -ptoml -oy '.package[] | select(.name == "tauri") | .version' nym-vpn-app/src-tauri/Cargo.lock)" >> build-info.txt
          echo "Rustc version: ${RUST_VERSION}" >> build-info.txt
          echo "Build profile: ${BUILD_PROFILE}" >> build-info.txt
          echo "Date:          ${BUILD_DATE}" >> build-info.txt
          cat build-info.txt

      - name: Upload build-info
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-info
          path: build-info.txt
          if-no-files-found: error
          retention-days: 1
