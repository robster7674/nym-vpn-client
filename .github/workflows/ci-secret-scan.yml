name: ci-secret-scan
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trufflehog:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Run the image directly, pinned by digest: trufflehog's own action pulls
      # by tag, which can be moved
      - name: Scan for leaked credentials
        env:
          IMAGE: ghcr.io/trufflesecurity/trufflehog@sha256:0d003fc3abc4e1565eca8462b992001314de51451e96e3c44de80d116794d5d1 # 3.99.7
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          args=()
          # On workflow_dispatch there is no PR range, so the whole history is scanned
          if [ -n "$BASE" ]; then
            args+=(--since-commit "$BASE" --branch "$HEAD")
          fi
          # Verified only: an "unknown" result means the provider's verify call
          # failed (outage, rate limit), which would make the check flaky.
          # Keep --github-actions last: the image's entrypoint re-parses the
          # final argument, so it must stay a plain single token
          docker run --rm -v "$PWD:/repo:ro" "$IMAGE" \
            git file:///repo "${args[@]}" \
            --results=verified --fail --no-update --github-actions
